# The edge, the only service compose publishes (on port 8020). Every request to amex-agent, both
# A2A calls and the statements page, passes through here, so the replicas need no published ports
# of their own. The upstream name resolves to every replica of the amex-agent service, and nginx
# keeps resolving it while it runs.

# Each access log line ends with the address of the replica that served the request, so the edge's
# log alone shows how requests spread over the replicas (docker-helper.sh --logs edge).
log_format replica '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   '${request_time}s upstream=$upstream_addr';

upstream amex_agent {
    # nginx looks the name up again in Docker's DNS every 5 seconds (valid=5s), so a replica added
    # with --scale or recreated by a redeploy receives requests without an edge restart. Looking
    # names up while running requires the shared memory zone.
    zone amex_agent 64k;
    resolver 127.0.0.11 valid=5s;
    server amex-agent:8020 resolve;
    # Keeps idle connections to the replicas open for reuse; this needs HTTP/1.1 and the empty
    # Connection header set below.
    keepalive 16;
}

server {
    # Listen on IPv4 and IPv6. The compose health check calls localhost, which Alpine resolves to
    # ::1 first, and the image's entrypoint script cannot add the IPv6 listen itself because this
    # file is mounted read-only.
    listen 8020;
    listen [::]:8020;
    access_log /var/log/nginx/access.log replica;

    # The statements page uploads one PDF of up to 5 MB (spring.servlet.multipart), plus the
    # multipart framing. The extra 1 MB lets a file just over 5 MB reach the agent, which rejects it
    # with a 413 that names the limit; past 6 MB the edge rejects it with a plain 413 itself.
    client_max_body_size 6m;

    location / {
        proxy_pass http://amex_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An A2A stream turns off nginx's buffering with its own X-Accel-Buffering: no header. It
        # sends nothing while the model categorizes a month's merchants, which can take longer
        # than nginx's default 60-second read timeout.
        proxy_read_timeout 300s;
    }
}
