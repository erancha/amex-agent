name: ci

on:
  push:
  pull_request:

# Runs the same entry point developers use, so CI and local verification cannot drift.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: bash scripts/test.sh all
      - name: Script tests
        run: for t in scripts/tests/test_*.sh; do bash "$t"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Client-side validation
        run: bash scripts/validate.sh
